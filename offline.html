<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17152b"><title>أنت غير متصل | مَدى</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f6f4ff;color:#17152b;font-family:Tahoma,Arial,sans-serif}.card{width:min(560px,100%);padding:clamp(24px,6vw,48px);border:1px solid #e6e2f4;border-radius:24px;background:#fff;text-align:center;box-shadow:0 24px 70px #17152b12}.mark{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:18px;background:#17152b;color:#34d6b0;font-size:25px;font-weight:900}.eyebrow{margin:20px 0 6px;color:#5b46e6;font-size:12px;font-weight:800}h1{margin:0;font-size:clamp(25px,5vw,36px)}p{color:#6a6882;font-size:14px;line-height:2}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}a,button{min-height:44px;padding:11px 16px;border:0;border-radius:12px;background:#5b46e6;color:#fff;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#eeeaff;color:#5b46e6}</style></head><body><main class="card"><div class="mark" aria-hidden="true">م</div><div class="eyebrow">مَدى · وضع عدم الاتصال</div><h1>أنت غير متصل بالإنترنت</h1><p>تعذّر تحميل هذه الصفحة الآن. قد تبقى بياناتك المحفوظة على هذا الجهاز متاحة عند العودة إلى الصفحة الرئيسية، لكن المزامنة والنشر والروابط الخارجية تحتاج إلى اتصال.</p><div class="actions"><a href="/">العودة إلى مَدى</a><button class="secondary" type="button" onclick="location.reload()">إعادة المحاولة</button></div></main></body></html>
