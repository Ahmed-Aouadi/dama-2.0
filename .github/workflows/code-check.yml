name: Code checks

permissions:
  contents: read

concurrency:
  group: mada-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node scripts/check-syntax.js
      - name: Install Playwright browser test dependency
        run: npm install --no-save --no-package-lock playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: node scripts/browser-smoke.js
