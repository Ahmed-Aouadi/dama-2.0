/* Public gallery templates and owner-defined design tokens */
#portfolioView{--purple:var(--gallery-accent,#5b46e6);--paper:var(--gallery-paper,#f6f4ff);color:var(--ink)}

/* Custom public portfolio typography, positioning, and backgrounds */
